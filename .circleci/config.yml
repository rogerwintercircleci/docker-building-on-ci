version: 2.1

jobs:
  build:
    environment:
      IMAGE_NAME: building-on-ci
    docker:
      - image: cimg/base:2026.10
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build --no-cache -t $IMAGE_NAME:latest .

workflows:
  build-and-publish:
    jobs:
      - build
